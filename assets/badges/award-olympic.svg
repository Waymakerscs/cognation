<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Track bronze award badge">
  <defs>
    <linearGradient id="ol-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#ol-bg)" stroke="#fff5f9" stroke-width="4"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,245,249,0.4)" stroke-width="2"/>
  <!-- abstract interlocking rings (not trademark) -->
  <g fill="none" stroke-width="3.5" opacity="0.95">
    <circle cx="42" cy="48" r="12" stroke="#2d5aa0"/>
    <circle cx="60" cy="48" r="12" stroke="#1a1a1a"/>
    <circle cx="78" cy="48" r="12" stroke="#c41e3a"/>
    <circle cx="51" cy="60" r="12" stroke="#e8a317"/>
    <circle cx="69" cy="60" r="12" stroke="#2a8f4e"/>
  </g>
  <text x="60" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#fff5f9">BRONZE</text>
  <text x="60" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#ffe8c8" letter-spacing="1">TRACK</text>
</svg>
