<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Biggest Heart yearbook badge">
  <defs>
    <linearGradient id="bh-felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3cb"/>
      <stop offset="100%" stop-color="#d9487a"/>
    </linearGradient>
    <linearGradient id="bh-heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f9"/>
      <stop offset="100%" stop-color="#ffd6e6"/>
    </linearGradient>
    <filter id="bh-pop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.2" dy="1.8" stdDeviation="1.2" flood-color="#5c1a33" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- heart-shaped embroidered patch outline -->
  <g filter="url(#bh-pop)">
    <path fill="url(#bh-felt)" stroke="#fff5f9" stroke-width="3.5"
      d="M70 128
         C28 96 12 72 12 48
         C12 28 28 16 46 16
         C58 16 66 22 70 30
         C74 22 82 16 94 16
         C112 16 128 28 128 48
         C128 72 112 96 70 128 Z"/>
    <path fill="none" stroke="#fff5f9" stroke-width="1.4" stroke-dasharray="2.8 2.2" opacity="0.8"
      d="M70 116
         C36 88 22 68 22 50
         C22 34 34 24 48 24
         C58 24 65 29 70 36
         C75 29 82 24 92 24
         C106 24 118 34 118 50
         C118 68 104 88 70 116 Z"/>
    <path fill="url(#bh-heart)"
      d="M70 92
         C48 74 38 60 38 48
         C38 38 46 32 55 32
         C62 32 67 36 70 41
         C73 36 78 32 85 32
         C94 32 102 38 102 48
         C102 60 92 74 70 92 Z"/>
  </g>
  <text x="70" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" font-weight="700" fill="#c93d6e" letter-spacing="0.3">BIGGEST</text>
  <text x="70" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" font-weight="700" fill="#c93d6e" letter-spacing="0.5">HEART</text>
</svg>
