<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200" role="img" aria-label="Founder bottle cap badge with horizontal safety pin">
  <defs>
    <radialGradient id="capFace" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff7d1"/>
      <stop offset="40%" stop-color="#ffd45a"/>
      <stop offset="100%" stop-color="#e89a1a"/>
    </radialGradient>
    <radialGradient id="capMetal" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </radialGradient>
    <filter id="pop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Horizontal cartoon safety pin (behind/through cap) -->
  <g filter="url(#pop)">
    <!-- pin shaft through cap (left hole to right hole) -->
    <line x1="48" y1="100" x2="212" y2="100" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <line x1="48" y1="100" x2="212" y2="100" stroke="#c8c8c8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- left spring coil (cartoon) -->
    <g transform="translate(28 100)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#111" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#bcbcbc" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#111" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#ddd" stroke-width="2"/>
    </g>

    <!-- right clasp / tip -->
    <g transform="translate(228 100)">
      <path d="M-8,0 L12,0 L18,-10 L18,10 Z" fill="#bdbdbd" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-2" cy="0" r="5" fill="#888" stroke="#111" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Bottle cap centered; pin appears to pierce left/right rims -->
  <g transform="translate(130 100)" filter="url(#pop)">
    <!-- crimp teeth -->
    <g stroke="#111" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0.0,-58.0 L5.6,-71.8 L9.1,-57.3 Z" fill="url(#capMetal)"/>
      <path d="M17.9,-55.2 L27.6,-66.5 L26.3,-51.7 Z" fill="url(#capMetal)"/>
      <path d="M34.1,-46.9 L46.8,-54.7 L41.0,-41.0 Z" fill="url(#capMetal)"/>
      <path d="M46.9,-34.1 L61.4,-37.6 L51.7,-26.3 Z" fill="url(#capMetal)"/>
      <path d="M55.2,-17.9 L70.0,-16.8 L57.3,-9.1 Z" fill="url(#capMetal)"/>
      <path d="M58.0,0.0 L71.8,5.6 L57.3,9.1 Z" fill="url(#capMetal)"/>
      <path d="M55.2,17.9 L66.5,27.6 L51.7,26.3 Z" fill="url(#capMetal)"/>
      <path d="M46.9,34.1 L54.7,46.8 L41.0,41.0 Z" fill="url(#capMetal)"/>
      <path d="M34.1,46.9 L37.6,61.4 L26.3,51.7 Z" fill="url(#capMetal)"/>
      <path d="M17.9,55.2 L16.8,70.0 L9.1,57.3 Z" fill="url(#capMetal)"/>
      <path d="M0.0,58.0 L-5.6,71.8 L-9.1,57.3 Z" fill="url(#capMetal)"/>
      <path d="M-17.9,55.2 L-27.6,66.5 L-26.3,51.7 Z" fill="url(#capMetal)"/>
      <path d="M-34.1,46.9 L-46.8,54.7 L-41.0,41.0 Z" fill="url(#capMetal)"/>
      <path d="M-46.9,34.1 L-61.4,37.6 L-51.7,26.3 Z" fill="url(#capMetal)"/>
      <path d="M-55.2,17.9 L-70.0,16.8 L-57.3,9.1 Z" fill="url(#capMetal)"/>
      <path d="M-58.0,0.0 L-71.8,-5.6 L-57.3,-9.1 Z" fill="url(#capMetal)"/>
      <path d="M-55.2,-17.9 L-66.5,-27.6 L-51.7,-26.3 Z" fill="url(#capMetal)"/>
      <path d="M-46.9,-34.1 L-54.7,-46.8 L-41.0,-41.0 Z" fill="url(#capMetal)"/>
      <path d="M-34.1,-46.9 L-37.6,-61.4 L-26.3,-51.7 Z" fill="url(#capMetal)"/>
      <path d="M-17.9,-55.2 L-16.8,-70.0 L-9.1,-57.3 Z" fill="url(#capMetal)"/>
    </g>
    <!-- bold black outline face -->
    <circle r="58" fill="url(#capFace)" stroke="#111" stroke-width="6"/>
    <circle r="48" fill="none" stroke="#111" stroke-width="3.5"/>
    <circle r="42" fill="none" stroke="#8b1a1a" stroke-width="2.5"/>
    <text y="6" text-anchor="middle" fill="#111" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="20" letter-spacing="1.5" stroke="#111" stroke-width="0.4">FOUNDER</text>
    <text y="24" text-anchor="middle" fill="#5c3310" font-family="Georgia, serif" font-size="8" font-style="italic">1950s soda pop</text>
    <ellipse cx="-16" cy="-20" rx="16" ry="9" fill="#fff" opacity="0.35"/>

    <!-- puncture dots where pin enters/exits (two end points on rim) -->
    <circle cx="-58" cy="0" r="5" fill="#333" stroke="#111" stroke-width="2"/>
    <circle cx="-58" cy="0" r="2" fill="#111"/>
    <circle cx="58" cy="0" r="5" fill="#333" stroke="#111" stroke-width="2"/>
    <circle cx="58" cy="0" r="2" fill="#111"/>
  </g>

  <!-- pin shaft redrawn on top through the two holes so it reads "through" -->
  <line x1="72" y1="100" x2="188" y2="100" stroke="#111" stroke-width="5" stroke-linecap="butt"/>
  <line x1="72" y1="100" x2="188" y2="100" stroke="#d8d8d8" stroke-width="2" stroke-linecap="butt"/>
</svg>
