<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="140" height="150" role="img" aria-label="Class President yearbook badge">
  <defs>
    <linearGradient id="cp-seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcce0"/>
      <stop offset="100%" stop-color="#d63d72"/>
    </linearGradient>
    <linearGradient id="cp-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f9"/>
      <stop offset="100%" stop-color="#ffd6e6"/>
    </linearGradient>
    <filter id="cp-pop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.3" flood-color="#5c1a33" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#cp-pop)">
    <!-- bottle-cap-adjacent scalloped seal -->
    <circle cx="70" cy="64" r="54" fill="url(#cp-seal)" stroke="#fff5f9" stroke-width="4"/>
    <g fill="#fff5f9" opacity="0.9">
      <circle cx="70" cy="10" r="4"/><circle cx="98" cy="18" r="4"/><circle cx="118" cy="38" r="4"/>
      <circle cx="124" cy="64" r="4"/><circle cx="118" cy="90" r="4"/><circle cx="98" cy="110" r="4"/>
      <circle cx="70" cy="118" r="4"/><circle cx="42" cy="110" r="4"/><circle cx="22" cy="90" r="4"/>
      <circle cx="16" cy="64" r="4"/><circle cx="22" cy="38" r="4"/><circle cx="42" cy="18" r="4"/>
    </g>
    <circle cx="70" cy="64" r="42" fill="none" stroke="rgba(255,245,249,0.5)" stroke-width="2"/>
    <!-- tiny crown -->
    <path d="M48 58 L54 42 L62 54 L70 38 L78 54 L86 42 L92 58 Z" fill="#fff5f9" stroke="#ffd6e6" stroke-width="1.2"/>
    <rect x="48" y="56" width="44" height="6" rx="1.5" fill="#fff5f9"/>
    <!-- ribbon banner -->
    <path d="M18 128 L28 112 L112 112 L122 128 L112 124 L28 124 Z" fill="url(#cp-banner)" stroke="#e85a8c" stroke-width="1.5"/>
    <text x="70" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" font-weight="700" fill="#fff5f9" letter-spacing="0.5">CLASS</text>
    <text x="70" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" font-weight="700" fill="#c93d6e" letter-spacing="0.4">PRESIDENT</text>
  </g>
</svg>
